name: AegentixHost
packages:
  AegentixMobileHost:
    path: .
targets:
  AegentixHost:
    type: application
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: Sources/AegentixHostApp
    dependencies:
      - package: AegentixMobileHost
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: us.shalominattii.aegentix.host
        SWIFT_VERSION: 6.0
        MARKETING_VERSION: 0.1.0
        CURRENT_PROJECT_VERSION: 1
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_NSCameraUsageDescription: AEGENTIX uses the camera only when an explicitly authorized host workflow requires it.
        INFOPLIST_KEY_NSLocalNetworkUsageDescription: AEGENTIX uses the local network to connect to the configured AEGENTIS CORE endpoint.
        CODE_SIGN_STYLE: Automatic
    entitlements:
      path: AegentixHost.entitlements
schemes:
  AegentixHost:
    build:
      targets:
        AegentixHost: all
    run:
      config: Debug
    archive:
      config: Release
